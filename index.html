<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#f7f8fc" />
  <meta name="description" content="WholesalePro — wholesale business management for customers, inventory, quotations and GST invoices." />
  <title>WholesalePro — Business Management</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <div id="app" class="app-shell">
    <aside class="sidebar" id="sidebar">
      <div class="brand-lockup">
        <div class="brand-mark">W</div>
        <div><div class="brand-name">Wholesale<span>Pro</span></div><div class="brand-caption">BUSINESS DESK</div></div>
      </div>
      <div class="workspace-label">WORKSPACE</div>
      <nav class="side-nav" aria-label="Main navigation">
        <button class="nav-item active" data-page="dashboard"><span class="nav-icon" data-icon="grid"></span><span>Dashboard</span></button>
        <div class="nav-section-label">MANAGE</div>
        <button class="nav-item" data-page="customers"><span class="nav-icon" data-icon="users"></span><span>Customers</span></button>
        <button class="nav-item" data-page="products"><span class="nav-icon" data-icon="box"></span><span>Products & stock</span></button>
        <button class="nav-item" data-page="quotations"><span class="nav-icon" data-icon="file"></span><span>Quotations</span></button>
        <button class="nav-item" data-page="invoices"><span class="nav-icon" data-icon="receipt"></span><span>Invoices & sales</span></button>
        <button class="nav-item" data-page="purchases"><span class="nav-icon" data-icon="truck"></span><span>Purchases</span></button>
        <button class="nav-item" data-page="suppliers"><span class="nav-icon" data-icon="building"></span><span>Suppliers</span></button>
        <button class="nav-item" data-page="expenses"><span class="nav-icon" data-icon="wallet"></span><span>Expenses</span></button>
        <div class="nav-section-label">INSIGHTS</div>
        <button class="nav-item" data-page="reports"><span class="nav-icon" data-icon="chart"></span><span>Reports</span></button>
      </nav>
      <div class="sidebar-bottom">
        <div class="help-card"><div class="help-icon" data-icon="spark"></div><strong>Business, in control.</strong><p>Keep your stock, sales and customer records organised in one place.</p></div>
        <button class="nav-item" data-page="settings"><span class="nav-icon" data-icon="settings"></span><span>Settings</span></button>
        <div class="sidebar-foot"><span class="online-dot"></span> Local workspace <span class="version">v1.0</span></div>
      </div>
    </aside>

    <main class="main-area">
      <header class="topbar">
        <button class="mobile-menu icon-button" id="mobileMenu" aria-label="Open menu"><span data-icon="menu"></span></button>
        <div class="breadcrumb"><span>Workspace</span><span class="crumb-divider">/</span><strong id="crumbTitle">Dashboard</strong></div>
        <div class="topbar-actions">
          <div class="today-chip"><span data-icon="calendar"></span><span id="todayLabel"></span></div>
          <button class="topbar-avatar" id="profileButton" title="Business settings">B</button>
        </div>
      </header>
      <section id="view" class="page-content" aria-live="polite"></section>
      <footer class="app-footer"><span>WholesalePro</span><span>Wholesale business management · Local-first edition</span></footer>
    </main>
  </div>

  <div class="modal-backdrop" id="modalBackdrop" aria-hidden="true">
    <section class="modal-panel" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <header class="modal-header"><div><div class="modal-eyebrow">WORKSPACE ACTION</div><h2 id="modalTitle">New record</h2></div><button class="icon-button" id="modalClose" aria-label="Close dialog"><span data-icon="close"></span></button></header>
      <div class="modal-content" id="modalContent"></div>
    </section>
  </div>
  <div class="toast-stack" id="toastStack" aria-live="polite"></div>
  <input type="file" id="importFile" accept="application/json,.json" hidden />
  <script src="./app.js"></script>
</body>
</html>
